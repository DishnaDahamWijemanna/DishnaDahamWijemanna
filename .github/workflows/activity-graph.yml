name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-activity-graph
    steps:
      - uses: actions/checkout@v4
      - uses: maurodesouza/github-readme-activity-graph-action@main
        with:
          username: DishnaDahamWijemanna
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: ./profile-activity-graph.svg
          options: |
            bg_color=0D1117
            color=6C5CE7
            line=6C5CE7
            point=ffffff
            area_color=6C5CE7
            hide_border=true
            area=true
            custom_title=Dishna's Contribution Activity
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update activity graph"
          file_pattern: "profile-activity-graph.svg"
